name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sim:
    name: sim (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python. Pinned to ubuntu-24.04 because actions/setup-python
          # has no 3.9 builds for Ubuntu 26.04, which ubuntu-latest will move to.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          python -c "import sys, numpy, matplotlib; print(sys.version); print('numpy', numpy.__version__, '/ matplotlib', matplotlib.__version__)"

      # 15 golden cases, compared exactly (results + trajectory hashes) against sim/regress_golden.json,
      # plus the finish rule (driving beside the line to the end is not a finish)
      - name: Regression test
        run: python sim/regress.py

      # The browser menu's programs as the page runs them: competition programs (2x-gear model included)
      # must finish in the default world and in most of the page's 8 randomized worlds
      - name: Browser programs
        run: python web/check_presets.py

      # Exit code is 0 whether the run finishes, times out or loses the line; non-zero only on a crash
      - name: Smoke run (EV3 final program)
        run: python sim/run_sim.py ev3/ev3_final.py --profile ev3_3s_geo --track main --no-plot --limit 20

      # Fails if a program in the browser menu no longer matches its simulator adjustments
      - name: Build the browser simulator
        run: python web/build.py --out _site
