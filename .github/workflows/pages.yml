name: Pages

# Builds the browser simulator (web/) and publishes it with GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      # Publish only a simulator that passes the same checks as CI
      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Regression test
        run: python sim/regress.py

      - name: Browser programs
        run: python web/check_presets.py

      # Copies web/ and bundles the simulator and the program menu
      - name: Build the browser simulator
        run: python web/build.py --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
